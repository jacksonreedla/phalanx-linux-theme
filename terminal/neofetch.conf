#!/bin/bash
#
# THE PHALANX — neofetch config
# Place at: ~/.config/neofetch/config.conf
# Make sure neofetch is installed: sudo apt install neofetch
# Then add `neofetch` to your ~/.bashrc to display on every terminal open.

# Monochrome brutalist neofetch config

print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk
    info "Local IP" local_ip
    info underline
    info "The Phalanx" "VOL. I · MMXXVI"
}

# === Phalanx ASCII logo (replaces distro logo) ===
ascii_distro="The Phalanx"
ascii_bold="on"
ascii_colors=(7 7)

# Use a custom ASCII banner instead of distro logo
# Set image_backend to "ascii" and ascii_distro to override
image_backend="ascii"

# Custom ASCII art — minimalist phalanx shield
ascii_banner='
          ┌─────────────┐
          │   ▲ ▲ ▲ ▲   │
          │   ▲ ▲ ▲ ▲   │
          │   ▲ ▲ ▲ ▲   │
          └─────────────┘
              THE PHALANX
       VOL. I · MMXXVI · MILES
'

# Colors — force everything to gray/white
colors=(7 7 7 7 7 7 7 7 7)
color_blocks="off"
verbose="off"

# Layout
gap=2
image_size="auto"
yoffset=0
xoffset=0
text_padding=4

# Separator
separator="   ·   "

# Bold
bold="on"

# Underline
underline_enabled="on"
underline_char="─"

# Title
uptime_shorthand="on"
os_arch="on"
memory_percent="on"
disk_percent="on"
disk_show=("/")

# Package managers
package_managers="on"

# Shell
shell_path="off"
shell_version="on"

# CPU
cpu_speed="on"
cpu_cores="off"
cpu_temp="off"

# GPU
gpu_type="all"

# Resolution
refresh_rate="off"

# GTK
gtk3="on"
gtk2="on"

# De / Wm
de_version="on"

# Block range
block_range=(0 7)

# === Color overrides — strip all color, force white/gray ===
# Override the per-info color to muted gray
# (neofetch reads these from ${cN} variables)
user_color="\033[1;37m"
at_color="\033[0;37m"
host_color="\033[1;37m"
underline_color="\033[0;37m"
title_color="\033[1;37m"
colon_color="\033[0;90m"
info_color="\033[0;37m"

# Hide unused
song_shorthand="off"
install_time="off"
public_ip="off"
public_ip_timeout=2
ip_timeout=1

# Restart loop
restart=1
